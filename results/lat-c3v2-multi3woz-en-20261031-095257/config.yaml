name: C3v2-laya-ft-aug
condition: C3v2
seed: 13
data:
  dataset: multi3woz
  lang: en
  split: dev
  root: data/processed
  path: null
  ontology: null
  train_split: train
  train_path: null
  loader: null
  limit: 100
requests:
  slots: intent
  intent: domain
  filled: state_before
  strip_gold: true
candidates:
  generators:
  - class: laya_slots.candidates.oracle.OracleGenerator
    params:
      k: 5
      p_absent: 0.0
      distractors: hard_no_overlap
      seed: 13
  fit: true
  shuffle: false
  max_candidates: null
judge:
  class: laya_slots.judges.laya_judge.LayaJudge
  params:
    mode: single
    checkpoint: multilingual
    candidate_order: shuffle
    rotations: 1
    device: cuda
  batch_size: 1
  finetuned: checkpoints/c3v2/multi3woz-en-s13
intent_predictor: null
output:
  save_probs: true
  log_every: 1000
