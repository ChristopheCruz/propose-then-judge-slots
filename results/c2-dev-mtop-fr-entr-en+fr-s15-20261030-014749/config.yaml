name: C2-laya-ft
condition: C2
seed: 15
data:
  dataset: mtop
  lang: fr
  split: dev
  root: data/processed
  path: null
  ontology: null
  train_split: train
  train_path: null
  loader: null
  limit: null
requests:
  slots: intent
  intent: gold
  filled: none
  strip_gold: true
candidates:
  generators:
  - class: laya_slots.candidates.oracle.OracleGenerator
    params:
      k: 5
      p_absent: 0.0
      distractors: hard_no_overlap
      seed: 15
  fit: true
  shuffle: false
  max_candidates: null
judge:
  class: laya_slots.judges.laya_judge.LayaJudge
  params:
    mode: single
    checkpoint: multilingual
    candidate_order: shuffle
    rotations: 1
    device: cuda
  batch_size: 128
  finetuned: checkpoints/c2/mtop-en+fr-s15
intent_predictor: null
output:
  save_probs: true
  log_every: 1000
