name: C4-llm-juge-reels
condition: C4
seed: 15
data:
  dataset: multiatis
  lang: en
  split: test
  root: data/processed
  path: null
  ontology: null
  train_split: train
  train_path: null
  loader: null
  limit: null
requests:
  slots: intent
  intent: gold
  filled: none
  strip_gold: true
candidates:
  generators:
  - class: laya_slots.candidates.lexicon.LexiconGenerator
    params: {}
  - class: laya_slots.candidates.gliner.GlinerGenerator
    params:
      model_name: urchade/gliner_multi-v2.1
      threshold: 0.3
      device: cuda
  - class: laya_slots.candidates.ontology.OntologyGenerator
    params:
      threshold: 0.85
  - class: laya_slots.candidates.history.HistoryGenerator
    params: {}
  fit: true
  shuffle: true
  max_candidates: 20
judge:
  class: laya_slots.judges.llm_judge.LLMJudge
  params:
    backend: vllm
    model: google/gemma-4-31B-it
    few_shot: null
    candidate_order: shuffle
    backend_kwargs:
      top_k_logprobs: 20
      chat_template_kwargs: auto
      llm_kwargs:
        tensor_parallel_size: 1
        max_model_len: 4096
        language_model_only: true
        gpu_memory_utilization: 0.88
    max_options: 20
  batch_size: 256
intent_predictor: null
output:
  save_probs: true
  log_every: 1000
